# OIDC authentication via Keycloak (chart 15 / Camunda 8.10).
# Centralises the OIDC settings shared by all components: authentication method, issuer URLs,
# client secrets and redirect URLs, and the Identity to Keycloak admin connection.
#
# Keycloak is not bundled in chart 15. Run it with recipes/keycloak (Keycloak operator): the service is
# keycloak-service:18080, served under /auth, and the operator creates the keycloak-initial-admin secret.
# Management Identity creates the <KEYCLOAK_REALM> realm, the OIDC clients and the first user at startup.
#
# Combine with identity-enabled.yaml.

global:
  security:
    authentication:
      method: oidc
  identity:
    auth:
      enabled: true
      type: KEYCLOAK
      publicIssuerUrl: <KEYCLOAK_EXT_URL>/auth/realms/<KEYCLOAK_REALM>
      issuerBackendUrl: http://keycloak-service:18080/auth/realms/<KEYCLOAK_REALM>
      authUrl: <KEYCLOAK_EXT_URL>/auth/realms/<KEYCLOAK_REALM>/protocol/openid-connect/auth
      tokenUrl: http://keycloak-service:18080/auth/realms/<KEYCLOAK_REALM>/protocol/openid-connect/token
      jwksUrl: http://keycloak-service:18080/auth/realms/<KEYCLOAK_REALM>/protocol/openid-connect/certs

      identity:
        redirectUrl: <IDENTITY_EXT_URL>/management

      orchestration:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-orchestration-client-token
        redirectUrl: <ORCHESTRATION_EXT_URL>/orchestration

      # The secret is required by Identity even when Optimize is disabled.
      # redirectUrl is harmless when Optimize is disabled.
      optimize:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-optimize-client-token
        redirectUrl: <OPTIMIZE_EXT_URL>/optimize

      camundaHub:
        redirectUrl: <WEB_MODELER_EXT_URL>/hub

    keycloak:
      url:
        protocol: http
        host: keycloak-service
        port: "18080"
      contextPath: /auth
      realm: /realms/<KEYCLOAK_REALM>
      auth:
        adminUser: <KEYCLOAK_ADMIN_USERNAME>
        secret:
          existingSecret: keycloak-initial-admin
          existingSecretKey: password

connectors:
  security:
    authentication:
      method: oidc
      oidc:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-connectors-client-token
