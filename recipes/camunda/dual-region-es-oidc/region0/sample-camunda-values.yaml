# OIDC authentication via Keycloak (chart 15 / Camunda 8.10).
# Centralises the OIDC settings shared by all components: authentication method, issuer URLs,
# client secrets and redirect URLs, and the Identity to Keycloak admin connection.
#
# Keycloak is not bundled in chart 15. Run it with recipes/keycloak (Keycloak operator): the service is
# keycloak-service:18080, served under /auth, and recipes/keycloak creates the keycloak-bootstrap-admin secret.
# Management Identity creates the camunda-platform realm, the OIDC clients and the first user at startup.
#
# Combine with identity-enabled.yaml.

# Region 0 overrides, merged last. Note that arrays (for example orchestration.env) are replaced, not merged.
# Region 0 runs a combined release: the region 0 zone of the Orchestration Cluster, Connectors, Management
# Identity, Camunda Hub and Optimize. Hub, Identity and Optimize are single region and are not part of the
# dual-region failover (https://docs.camunda.io/docs/self-managed/concepts/multi-region/dual-region/#management-platform-and-orchestration-cluster).
global:
  security:
    authentication:
      method: oidc
  identity:
    auth:
      enabled: true
      type: KEYCLOAK
      publicIssuerUrl: https://region0.example.com/auth/realms/camunda-platform
      issuerBackendUrl: http://keycloak-service:18080/auth/realms/camunda-platform
      authUrl: https://region0.example.com/auth/realms/camunda-platform/protocol/openid-connect/auth
      tokenUrl: http://keycloak-service:18080/auth/realms/camunda-platform/protocol/openid-connect/token
      jwksUrl: http://keycloak-service:18080/auth/realms/camunda-platform/protocol/openid-connect/certs
      identity:
        redirectUrl: https://region0.example.com/management
      orchestration:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-orchestration-client-token
        redirectUrl: https://region0.example.com/orchestration
      # The secret is required by Identity even when Optimize is disabled.
      # redirectUrl is harmless when Optimize is disabled.
      optimize:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-optimize-client-token
        redirectUrl: https://region0.example.com/optimize
      camundaHub:
        redirectUrl: https://region0.example.com/hub
    keycloak:
      url:
        protocol: http
        host: keycloak-service
        port: "18080"
      contextPath: /auth
      realm: /realms/camunda-platform
      auth:
        adminUser: temp-admin
        secret:
          existingSecret: keycloak-bootstrap-admin
          existingSecretKey: password
connectors:
  security:
    authentication:
      method: oidc
      oidc:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-connectors-client-token
# Management Identity on an external PostgreSQL database (chart 15 does not bundle PostgreSQL).
# Run the database with recipes/postgres (pg-identity cluster: service pg-identity-rw, secret pg-identity-secret).
# Combine with oidc.yaml for the Keycloak connection.
identity:
  enabled: true
  contextPath: /management
  fullURL: https://region0.example.com/management
  firstUser:
    secret:
      existingSecret: camunda-credentials
      existingSecretKey: identity-first-user-password
  env:
    - name: KEYCLOAK_REALM
      value: camunda-platform
  externalDatabase:
    enabled: true
    host: pg-identity-rw
    port: 5432
    database: identity
    username: identity
    secret:
      existingSecret: pg-identity-secret
      existingSecretKey: password
# Camunda Hub (chart 15 / Camunda 8.10): replaces Web Modeler and Console.
# Needs a PostgreSQL database: run recipes/postgres (pg-hub cluster: service pg-hub-rw, secret pg-hub-secret).
# Pair with oidc.yaml. Hub's pods and services are still named web-modeler-*.
camundaHub:
  enabled: true
  contextPath: /hub
  # WebSocket public reachability for the browser client.
  # The chart only fills these in from global.ingress when global.ingress.enabled=true.
  # Recipes that use Traefik IngressRoute CRDs (no chart-managed Ingress) need them set here.
  websockets:
    publicHost: region0.example.com
    publicPort: 443
    env:
      # The websocket server is mounted at /hub-ws, so it accepts requests on that prefix instead of "/".
      - name: PUSHER_APP_PATH
        value: "/hub-ws"
  restapi:
    # Stable Pusher app key + secret from camunda-credentials so the values do not rotate on `helm upgrade`
    # (the chart otherwise regenerates them on every render). restapi and websockets use the same refs.
    pusher:
      secret:
        existingSecret: camunda-credentials
        existingSecretKey: webmodeler-pusher-app-secret
      client:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: webmodeler-pusher-app-key
    externalDatabase:
      host: pg-hub-rw
      port: 5432
      database: hub
      username: hub
      secret:
        existingSecret: pg-hub-secret
        existingSecretKey: password
    # Mail configuration is required, otherwise the restapi pod does not start. The mail.fromAddress and
    # mail.fromName values are deprecated in chart 15, so they are supplied through unified configuration.
    extraConfiguration:
      - file: hub-mail.yaml
        content: |
          camunda:
            modeler:
              mail:
                from-address: noreply@region0.example.com
                from-name: Camunda Platform
      # Test mode (Test tab in the BPMN editor). The default is already true for the Kubernetes distribution;
      # set explicitly so it is visible and easy to turn off. Needs an 8.10+ Orchestration Cluster.
      - file: hub-test-mode.yaml
        content: |
          camunda:
            hub:
              feature:
                test-mode-enabled: true
    env:
      # The chart only sets the Pusher client path and TLS flag when global.ingress.enabled is true.
      # Without a chart-managed Ingress (Traefik IngressRoute) they must be set here.
      - name: CAMUNDA_HUB_PUSHER_CLIENT_FORCETLS
        value: "true"
      - name: CAMUNDA_HUB_PUSHER_CLIENT_PATH
        value: "/hub-ws"
# Zeebe brokers resolve through the dns-chain CoreDNS (fixed ClusterIP 10.104.0.53), which forwards the other
# region's namespace to the other cluster and everything else to the local kube-dns.
# Needed on GKE, where kube-dns stubDomains cannot forward names under cluster.local. Created by
# `make -C recipes/google/gke-dual-region` (deploy-dns-chain). Only the brokers resolve remote names: contact points,
# broker advertised hosts and the remote Elasticsearch exporter.
orchestration:
  data:
    secondaryStorage:
      type: elasticsearch
      elasticsearch:
        url: http://elasticsearch-es-http:9200
        auth:
          username: elastic
          secret:
            existingSecret: elasticsearch-es-elastic-user
            existingSecretKey: elastic
  contextPath: /orchestration
  security:
    authentication:
      oidc:
        secret:
          existingSecret: "camunda-credentials"
          existingSecretKey: "identity-orchestration-client-token"
        redirectUrl: https://region0.example.com/orchestration
    initialization:
      # Lets the "connectors" client deploy and read resources, so the benchmark tool and REST smoke tests (which
      # authenticate as "connectors") can deploy their processes. Same grant as oidc-gateway-traefik-tls-es.
      # Identical in both regions, because both regions' brokers belong to the same cluster.
      authorizations:
        - ownerType: ROLE
          ownerId: connectors
          resourceType: RESOURCE
          resourceId: "*"
          permissions:
            - CREATE
            - READ
  # clusterSize and replicationFactor are derived by the chart from the zones list. Do not set them.
  partitionCount: "8"
  partitioning:
    scheme: zone-aware
    zone: region0
    # Identical list in both regions. Region 0 has the higher priority, so it holds most partition leaders.
    zones:
      - name: region0
        numberOfBrokers: 4
        numberOfReplicas: 2
        priority: 100
      - name: region1
        numberOfBrokers: 4
        numberOfReplicas: 2
        priority: 90
  # Zone awareness places partition replicas between the regions. Spreading the broker pods over the
  # availability zones inside each region is a separate, Kubernetes level setting.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: zeebe-broker
          app.kubernetes.io/instance: camunda
  # The exporters are configured explicitly through env below: one Camunda exporter per region, and the
  # legacy Elasticsearch exporter that Optimize imports from.
  exporters:
    zeebe:
      enabled: false
  extraConfiguration:
    - file: orchestration-camunda-exporter.yaml
      content: |
        camunda:
          data:
            secondary-storage:
              autoconfigure-camunda-exporter: false
  env:
    # One headless Zeebe service per zone is enough, gossip finds the other brokers
    - name: CAMUNDA_CLUSTER_INITIALCONTACTPOINTS
      value: camunda-zeebe-region0.region0.svc.cluster.local:26502,camunda-zeebe-region1.region1.svc.cluster.local:26502
    # Cross-region membership tuning, from the Camunda EKS dual-region reference values
    - name: CAMUNDA_CLUSTER_MEMBERSHIP_PROBETIMEOUT
      value: 1000ms
    - name: CAMUNDA_CLUSTER_MEMBERSHIP_PROBEINTERVAL
      value: 2s
    - name: CAMUNDA_CLUSTER_MEMBERSHIP_FAILURETIMEOUT
      value: 10000ms
    - name: CAMUNDA_CLUSTER_RAFT_SNAPSHOTREQUESTTIMEOUT
      value: 10s
    - name: CAMUNDA_CLUSTER_COMPRESSIONALGORITHM
      value: GZIP
    # Region 0 Elasticsearch. Headless service: pod IPs are routable across the clusters, ClusterIPs are not.
    - name: CAMUNDA_DATA_EXPORTERS_CAMUNDAREGION0_CLASSNAME
      value: io.camunda.exporter.CamundaExporter
    - name: CAMUNDA_DATA_EXPORTERS_CAMUNDAREGION0_ARGS_CONNECT_URL
      value: http://elasticsearch-es-masters.region0.svc.cluster.local:9200
    - name: CAMUNDA_DATA_EXPORTERS_CAMUNDAREGION0_ARGS_CONNECT_USERNAME
      value: elastic
    - name: CAMUNDA_DATA_EXPORTERS_CAMUNDAREGION0_ARGS_CONNECT_PASSWORD
      valueFrom:
        secretKeyRef:
          name: elasticsearch-es-password-region-0
          key: elastic
    # Region 1 Elasticsearch
    - name: CAMUNDA_DATA_EXPORTERS_CAMUNDAREGION1_CLASSNAME
      value: io.camunda.exporter.CamundaExporter
    - name: CAMUNDA_DATA_EXPORTERS_CAMUNDAREGION1_ARGS_CONNECT_URL
      value: http://elasticsearch-es-masters.region1.svc.cluster.local:9200
    - name: CAMUNDA_DATA_EXPORTERS_CAMUNDAREGION1_ARGS_CONNECT_USERNAME
      value: elastic
    - name: CAMUNDA_DATA_EXPORTERS_CAMUNDAREGION1_ARGS_CONNECT_PASSWORD
      valueFrom:
        secretKeyRef:
          name: elasticsearch-es-password-region-1
          key: elastic
    # Legacy Elasticsearch exporter for Optimize, which runs in region 0 and reads the region 0 Elasticsearch.
    # Each broker exports only the partitions it leads, so it runs on every broker in both regions.
    - name: CAMUNDA_DATA_EXPORTERS_OPTIMIZE_CLASSNAME
      value: io.camunda.zeebe.exporter.ElasticsearchExporter
    - name: CAMUNDA_DATA_EXPORTERS_OPTIMIZE_ARGS_URL
      value: http://elasticsearch-es-masters.region0.svc.cluster.local:9200
    - name: CAMUNDA_DATA_EXPORTERS_OPTIMIZE_ARGS_AUTHENTICATION_USERNAME
      value: elastic
    - name: CAMUNDA_DATA_EXPORTERS_OPTIMIZE_ARGS_AUTHENTICATION_PASSWORD
      valueFrom:
        secretKeyRef:
          name: elasticsearch-es-password-region-0
          key: elastic
    - name: CAMUNDA_DATA_EXPORTERS_OPTIMIZE_ARGS_INDEX_PREFIX
      value: zeebe-record
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 6Gi
  dnsPolicy: "None"
  dnsConfig:
    nameservers:
      - 10.104.0.53
    searches:
      - region0.svc.cluster.local
      - svc.cluster.local
      - cluster.local
    options:
      - name: ndots
        value: "5"
  # Centralized secret resolution (8.10): processes reference camunda.secrets.NAME. The chart mounts the
  # Kubernetes Secret below read-only at /etc/camunda/secrets, one file per key. Create it with
  # recipes/camunda/secret-manager/file-store. Only one secret store is allowed per physical tenant.
  secretStore:
    file:
      default:
        secret:
          existingSecret: camunda-process-secrets
# Optimize connected to the ECK-managed Elasticsearch from recipes/elasticsearch.
# OIDC redirect for Optimize is configured via global.identity.auth.optimize.redirectUrl
# in oidc.yaml.
optimize:
  enabled: true
  contextPath: "/optimize"
  database:
    elasticsearch:
      enabled: true
      external: true
      url:
        protocol: http
        host: elasticsearch-es-http
        port: 9200
      auth:
        username: elastic
        secret:
          existingSecret: elasticsearch-es-elastic-user
          existingSecretKey: elastic
  migration:
    enabled: false
  # Optimize imports one zeebe-record stream per partition and does not follow orchestration.partitionCount: the chart
  # takes it from the deprecated optimize.partitionCount (default 3) unless it is set here. With fewer partitions than
  # the cluster, Optimize silently misses every process instance on the remaining partitions.
  extraConfiguration:
    - file: optimize-partitions.yaml
      content: |
        zeebe:
          partitionCount: 8
prometheusServiceMonitor:
  enabled: true
  labels:
    release: metrics
