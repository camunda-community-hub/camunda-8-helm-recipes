# OIDC authentication via Keycloak (chart 15 / Camunda 8.10).
# Centralises the OIDC settings shared by all components: authentication method, issuer URLs,
# client secrets and redirect URLs, and the Identity to Keycloak admin connection.
#
# Keycloak is not bundled in chart 15. Run it with recipes/keycloak (Keycloak operator): the service is
# keycloak-service:18080, served under /auth, and recipes/keycloak creates the keycloak-bootstrap-admin secret.
# Management Identity creates the camunda-platform realm, the OIDC clients and the first user at startup.
#
# Combine with identity-enabled.yaml.
prometheusServiceMonitor:
  enabled: true
  labels:
    release: metrics
global:
  security:
    authentication:
      method: oidc
  identity:
    auth:
      enabled: true
      type: KEYCLOAK
      publicIssuerUrl: https://example.com/auth/realms/camunda-platform
      issuerBackendUrl: http://keycloak-service:18080/auth/realms/camunda-platform
      authUrl: https://example.com/auth/realms/camunda-platform/protocol/openid-connect/auth
      tokenUrl: http://keycloak-service:18080/auth/realms/camunda-platform/protocol/openid-connect/token
      jwksUrl: http://keycloak-service:18080/auth/realms/camunda-platform/protocol/openid-connect/certs
      identity:
        redirectUrl: https://example.com/management
      orchestration:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-orchestration-client-token
        redirectUrl: https://example.com/orchestration
      # The secret is required by Identity even when Optimize is disabled.
      # redirectUrl is harmless when Optimize is disabled.
      optimize:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-optimize-client-token
        redirectUrl: https://example.com/optimize
      camundaHub:
        redirectUrl: https://example.com/hub
    keycloak:
      url:
        protocol: http
        host: keycloak-service
        port: "18080"
      contextPath: /auth
      realm: /realms/camunda-platform
      auth:
        adminUser: temp-admin
        secret:
          existingSecret: keycloak-bootstrap-admin
          existingSecretKey: password
connectors:
  security:
    authentication:
      method: oidc
      oidc:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-connectors-client-token
# Management Identity on an external PostgreSQL database (chart 15 does not bundle PostgreSQL).
# Run the database with recipes/postgres (pg-identity cluster: service pg-identity-rw, secret pg-identity-secret).
# Combine with oidc.yaml for the Keycloak connection.
identity:
  enabled: true
  contextPath: /management
  fullURL: https://example.com/management
  firstUser:
    secret:
      existingSecret: camunda-credentials
      existingSecretKey: identity-first-user-password
  env:
    - name: KEYCLOAK_REALM
      value: camunda-platform
  externalDatabase:
    enabled: true
    host: pg-identity-rw
    port: 5432
    database: identity
    username: identity
    secret:
      existingSecret: pg-identity-secret
      existingSecretKey: password
# Camunda Hub (chart 15 / Camunda 8.10): replaces Web Modeler and Console.
# Needs a PostgreSQL database: run recipes/postgres (pg-hub cluster: service pg-hub-rw, secret pg-hub-secret).
# Pair with oidc.yaml. Hub's pods and services are still named web-modeler-*.
camundaHub:
  enabled: true
  contextPath: /hub
  # WebSocket public reachability for the browser client.
  # The chart only fills these in from global.ingress when global.ingress.enabled=true.
  # Recipes that use Traefik IngressRoute CRDs (no chart-managed Ingress) need them set here.
  websockets:
    publicHost: example.com
    publicPort: 443
    env:
      # The websocket server is mounted at /hub-ws, so it accepts requests on that prefix instead of "/".
      - name: PUSHER_APP_PATH
        value: "/hub-ws"
  restapi:
    # Stable Pusher app key + secret from camunda-credentials so the values do not rotate on `helm upgrade`
    # (the chart otherwise regenerates them on every render). restapi and websockets use the same refs.
    pusher:
      secret:
        existingSecret: camunda-credentials
        existingSecretKey: webmodeler-pusher-app-secret
      client:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: webmodeler-pusher-app-key
    externalDatabase:
      host: pg-hub-rw
      port: 5432
      database: hub
      username: hub
      secret:
        existingSecret: pg-hub-secret
        existingSecretKey: password
    # Mail configuration is required, otherwise the restapi pod does not start. The mail.fromAddress and
    # mail.fromName values are deprecated in chart 15, so they are supplied through unified configuration.
    extraConfiguration:
      - file: hub-mail.yaml
        content: |
          camunda:
            modeler:
              mail:
                from-address: noreply@example.com
                from-name: Camunda Platform
    env:
      # The chart only sets the Pusher client path and TLS flag when global.ingress.enabled is true.
      # Without a chart-managed Ingress (Traefik IngressRoute) they must be set here.
      - name: CAMUNDA_HUB_PUSHER_CLIENT_FORCETLS
        value: "true"
      - name: CAMUNDA_HUB_PUSHER_CLIENT_PATH
        value: "/hub-ws"
# Orchestration Cluster secondary storage in an external OpenSearch cluster (chart 15 / Camunda 8.10).
# The connection comes from OPENSEARCH_PROTOCOL, OPENSEARCH_HOST, OPENSEARCH_PORT and OPENSEARCH_USERNAME in config.mk.
# Chart 15 has no global.opensearch. The password is read from the camunda-credentials secret (opensearch-password).
# Chart 15 does not bundle OpenSearch. Pair with optimize-opensearch.yaml.
orchestration:
  data:
    secondaryStorage:
      type: opensearch
      opensearch:
        url: http://opensearch-cluster-master.shared-services.svc.cluster.local:9200
        auth:
          username: admin
          secret:
            existingSecret: camunda-credentials
            existingSecretKey: opensearch-password
  contextPath: /orchestration
  security:
    authentication:
      oidc:
        secret:
          existingSecret: "camunda-credentials"
          existingSecretKey: "identity-orchestration-client-token"
        redirectUrl: https://example.com/orchestration
  clusterSize: "1"
  partitionCount: "1"
  replicationFactor: "1"
# Optimize connected to an external OpenSearch cluster (chart 15 / Camunda 8.10).
# The connection comes from OPENSEARCH_* in config.mk. Chart 15 has no global.opensearch.
# OIDC redirect for Optimize is configured via global.identity.auth.optimize.redirectUrl
# in oidc.yaml.
optimize:
  enabled: true
  contextPath: "/optimize"
  database:
    opensearch:
      enabled: true
      url:
        protocol: http
        host: opensearch-cluster-master.shared-services.svc.cluster.local
        port: 9200
      auth:
        username: admin
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: opensearch-password
