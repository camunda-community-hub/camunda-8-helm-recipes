# Chart 15 (Camunda 8.10+) ingress-nginx with TLS. The hostname moved from global.ingress.host
# (removed in chart 15) to global.host. Supersedes enable-ingress-nginx.yaml for chart 15.
# Helm chart values are imported from `../camunda-values.yaml.d` via `config.mk`.
# This file only contains additional overrides.
# Note that array values, e.g. `zeebe.env` can NOT be merged by Helm.
global:
  host: "example.camunda.com"
  ingress:
    enabled: true
    className: nginx
    tls:
      enabled: true
      secretName: "tls-secret"
  security:
    authentication:
      method: oidc
  identity:
    auth:
      enabled: true
      type: KEYCLOAK
      publicIssuerUrl: https://example.camunda.com/auth/realms/camunda-platform
      issuerBackendUrl: http://keycloak-service:18080/auth/realms/camunda-platform
      authUrl: https://example.camunda.com/auth/realms/camunda-platform/protocol/openid-connect/auth
      tokenUrl: http://keycloak-service:18080/auth/realms/camunda-platform/protocol/openid-connect/token
      jwksUrl: http://keycloak-service:18080/auth/realms/camunda-platform/protocol/openid-connect/certs
      identity:
        redirectUrl: https://example.camunda.com/management
      orchestration:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-orchestration-client-token
        redirectUrl: https://example.camunda.com/orchestration
      # The secret is required by Identity even when Optimize is disabled.
      # redirectUrl is harmless when Optimize is disabled.
      optimize:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-optimize-client-token
        redirectUrl: https://example.camunda.com/optimize
      camundaHub:
        redirectUrl: https://example.camunda.com/hub
    keycloak:
      url:
        protocol: http
        host: keycloak-service
        port: "18080"
      contextPath: /auth
      realm: /realms/camunda-platform
      auth:
        adminUser: temp-admin
        secret:
          existingSecret: keycloak-bootstrap-admin
          existingSecretKey: password
orchestration:
  gateway:
    grpc:
      enabled: true
  ingress:
    grpc:
      enabled: true
      host: "grpc.example.camunda.com"
      path: "/"
      tls:
        enabled: true
        secretName: "grpc-tls-secret"
  enabled: true
  exporters:
    camunda:
      enabled: false
    rdbms:
      enabled: true
  data:
    secondaryStorage:
      type: rdbms
      rdbms:
        url: jdbc:postgresql://mypostgresql.camunda.com:5432/camunda
        username: camunda
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: orchestration-rdbms-password
  contextPath: /orchestration
  security:
    authentication:
      oidc:
        secret:
          existingSecret: "camunda-credentials"
          existingSecretKey: "identity-orchestration-client-token"
        redirectUrl: https://example.camunda.com/orchestration
  clusterSize: "1"
  partitionCount: "1"
  replicationFactor: "1"
connectors:
  security:
    authentication:
      method: oidc
      oidc:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-connectors-client-token
# Identity uses the external PostgreSQL (POSTGRES_HOST) instead of the CloudNativePG cluster that
# identity-enabled.yaml assumes. The password comes from camunda-credentials.
identity:
  enabled: true
  contextPath: /management
  fullURL: https://example.camunda.com/management
  firstUser:
    secret:
      existingSecret: camunda-credentials
      existingSecretKey: identity-first-user-password
  env:
    - name: KEYCLOAK_REALM
      value: camunda-platform
  externalDatabase:
    enabled: true
    host: mypostgresql.camunda.com
    port: 5432
    database: identity
    username: identity
    secret:
      existingSecret: camunda-credentials
      existingSecretKey: identity-postgresql-user-password
