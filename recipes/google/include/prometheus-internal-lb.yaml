# Exposes this cluster's Prometheus (kube-prometheus-stack release "metrics") on a private IP, so a Prometheus in
# the other region can remote-write to it (http://<ip>:9090/api/v1/write, needs enableRemoteWriteReceiver).
#
# Internal passthrough load balancer with global access: the IP is only reachable from inside the VPC,
# but from every region of it.
apiVersion: v1
kind: Service
metadata:
  name: prometheus-internal-lb
  namespace: default
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
    networking.gke.io/internal-load-balancer-allow-global-access: "true"
spec:
  type: LoadBalancer
  ports:
    - name: http-web
      port: 9090
      protocol: TCP
      targetPort: 9090
  selector:
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: metrics-kube-prometheus-st-prometheus
