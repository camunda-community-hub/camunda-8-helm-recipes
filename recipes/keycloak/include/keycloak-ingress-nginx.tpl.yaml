# nginx Ingress for Keycloak under /auth, used when KEYCLOAK_INGRESS=nginx.
# Traefik recipes route /auth through their IngressRoute instead (recipes/gateway-traefik).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
  annotations:
    # Keycloak tokens and cookies are large
    nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - <KEYCLOAK_HOST>
      secretName: <TLS_SECRET_NAME>
  rules:
    - host: <KEYCLOAK_HOST>
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 18080
