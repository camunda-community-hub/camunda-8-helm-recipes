# Chart 15 (Camunda 8.10+) ingress-nginx with TLS. The hostname moved from global.ingress.host
# (removed in chart 15) to global.host. Supersedes enable-ingress-nginx.yaml for chart 15.
# Chart 15 (Camunda 8.10+): OIDC against an EXTERNAL Keycloak, plus Identity on external PostgreSQL.
# Chart 15 no longer bundles Keycloak (no identityKeycloak / identityPostgresql), so run your own.
# Identity connects to Keycloak's admin API on first boot and creates the camunda-platform realm.
# Supersedes oidc.yaml + identity-keycloak-*.yaml, which target chart 14.
global:
  host: "camunda.local"
  ingress:
    enabled: true
    className: nginx
    tls:
      enabled: true
      secretName: "tls-secret"
  extraManifests:
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: camunda-identity-host
        annotations:
          nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
      spec:
        ingressClassName: nginx
        tls:
          - hosts: [identity.camunda.local]
            secretName: tls-secret
        rules:
          - host: identity.camunda.local
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: camunda-identity
                      port:
                        number: 80
    # Hub builds its "Management Identity" link as <global.host><identity.contextPath> and ignores
    # identity.fullURL, so the link is https://camunda.local/ . Redirect that bare root to Identity.
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: camunda-root-to-identity
        annotations:
          nginx.ingress.kubernetes.io/permanent-redirect: https://identity.camunda.local
          nginx.ingress.kubernetes.io/permanent-redirect-code: "302"
      spec:
        ingressClassName: nginx
        tls:
          - hosts: [camunda.local]
            secretName: tls-secret
        rules:
          - host: camunda.local
            http:
              paths:
                - path: /
                  pathType: Exact
                  backend:
                    service:
                      name: camunda-identity
                      port:
                        number: 80
  security:
    authentication:
      method: oidc
  identity:
    auth:
      enabled: true
      publicIssuerUrl: https://camunda.local/auth/realms/camunda-platform
      issuerBackendUrl: http://camunda-keycloak/auth/realms/camunda-platform
      authUrl: https://camunda.local/auth/realms/camunda-platform/protocol/openid-connect/auth
      tokenUrl: http://camunda-keycloak/auth/realms/camunda-platform/protocol/openid-connect/token
      jwksUrl: http://camunda-keycloak/auth/realms/camunda-platform/protocol/openid-connect/certs
      identity:
        redirectUrl: https://identity.camunda.local
      webModeler:
        redirectUrl: https://camunda.local/hub
      camundaHub:
        redirectUrl: https://camunda.local/hub
      # Identity still requires this even though Optimize is disabled
      optimize:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-optimize-client-token
    keycloak:
      url:
        protocol: http
        host: camunda-keycloak
        port: 80
      contextPath: /auth
      realm: /realms/camunda-platform
      auth:
        adminUser: admin
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-keycloak-admin-password
# Minimal topology for feature testing, not load.
orchestration:
  gateway:
    grpc:
      enabled: true
  ingress:
    grpc:
      enabled: true
      host: "grpc.camunda.local"
      path: "/"
      tls:
        enabled: true
        secretName: "grpc-tls-secret"
  contextPath: /orchestration
  security:
    authentication:
      method: oidc
      oidc:
        redirectUrl: https://camunda.local/orchestration
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-orchestration-client-token
  enabled: true
  exporters:
    camunda:
      enabled: false
    rdbms:
      enabled: true
  data:
    secondaryStorage:
      type: rdbms
      rdbms:
        url: jdbc:postgresql://postgres:5432/camunda
        username: camunda
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: orchestration-rdbms-password
  clusterSize: "1"
  partitionCount: "1"
  replicationFactor: "1"
  pvcSize: 5Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
identity:
  enabled: true
  # No contextPath: the Management Identity UI (8.10 alpha5) breaks under a sub-path.
  # Serve it on its own hostname, see identity-own-hostname.yaml.
  fullURL: https://identity.camunda.local
  firstUser:
    secret:
      existingSecret: camunda-credentials
      existingSecretKey: identity-first-user-password
  env:
    - name: KEYCLOAK_REALM
      value: camunda-platform
  externalDatabase:
    enabled: true
    host: postgres
    port: 5432
    database: identity
    schema: public
    username: identity
    secret:
      existingSecret: camunda-credentials
      existingSecretKey: identity-postgresql-user-password
connectors:
  security:
    authentication:
      method: oidc
      oidc:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-connectors-client-token
  enabled: true
# Camunda Hub (chart 15 / Camunda 8.10): replaces Web Modeler and Console.
# Needs a PostgreSQL database: run recipes/postgres (pg-hub cluster: service pg-hub-rw, secret pg-hub-secret).
# Pair with oidc.yaml. Hub's pods and services are still named web-modeler-*.
camundaHub:
  enabled: true
  contextPath: /hub
  # WebSocket public reachability for the browser client.
  # The chart only fills these in from global.ingress when global.ingress.enabled=true.
  # Recipes that use Traefik IngressRoute CRDs (no chart-managed Ingress) need them set here.
  websockets:
    publicHost: camunda.local
    publicPort: 443
    env:
      # The websocket server is mounted at /hub-ws, so it accepts requests on that prefix instead of "/".
      - name: PUSHER_APP_PATH
        value: "/hub-ws"
  restapi:
    # Stable Pusher app key + secret from camunda-credentials so the values do not rotate on `helm upgrade`
    # (the chart otherwise regenerates them on every render). restapi and websockets use the same refs.
    pusher:
      secret:
        existingSecret: camunda-credentials
        existingSecretKey: webmodeler-pusher-app-secret
      client:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: webmodeler-pusher-app-key
    externalDatabase:
      host: postgres
      port: 5432
      database: modeler
      username: modeler
      secret:
        existingSecret: pg-hub-secret
        existingSecretKey: password
    # Mail configuration is required, otherwise the restapi pod does not start. The mail.fromAddress and
    # mail.fromName values are deprecated in chart 15, so they are supplied through unified configuration.
    extraConfiguration:
      - file: hub-mail.yaml
        content: |
          camunda:
            modeler:
              mail:
                from-address: 
                from-name: Camunda Platform
    env:
      # The chart only sets the Pusher client path and TLS flag when global.ingress.enabled is true.
      # Without a chart-managed Ingress (Traefik IngressRoute) they must be set here.
      - name: CAMUNDA_HUB_PUSHER_CLIENT_FORCETLS
        value: "true"
      - name: CAMUNDA_HUB_PUSHER_CLIENT_PATH
        value: "/hub-ws"
optimize:
  enabled: false
